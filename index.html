<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <div class="icone">%</div>

        <section class="conteudo">
            <h1>Calculadora de Desconto</h1>
            <p class="descricao">Digite o valor total da compra para calcular o desconto.</p>

            <form id="calcForm">
                <div class="form-group">
                    <label for="valorCompra">Valor total da compra (R$)</label>
                    <input
                        type="number"
                        id="valorCompra"
                        name="valorCompra"
                        min="0"
                        step="0.01"
                        required
                        placeholder="Ex.: 399.90"
                    >
                </div>

                <button type="submit">Calcular desconto</button>
            </form>

            <div class="resultados">
                <p>Valor do desconto: <strong id="resultadoDesconto">R$ 0,00</strong></p>
                <p>Total com desconto: <strong id="resultadoTotal">R$ 0,00</strong></p>
            </div>
        </section>
    </main>
<script src="main.js"></script>    
</body>
</html>
